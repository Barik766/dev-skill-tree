<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Dev Skill Tree — your developer roadmap as an unlockable dependency graph in a terminal. Pick a project, unlock skills, share your build." />
<meta name="theme-color" content="#0a0a0a" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Dev Skill Tree — level up your dev path" />
<meta property="og:description" content="A developer roadmap rendered as a console dependency graph. Pick your project, unlock skills, share your build." />
<title>Dev Skill Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #121212;
    --panel-2: #161616;
    --yellow: #ffe600;
    --gold: #ffb800;
    --line: rgba(255, 230, 0, 0.22);
    --text: #ececec;
    --muted: #8c8c8c;
    --dim: #565b6b;
    --grid: rgba(255, 255, 255, 0.035);
    --font: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--text); background: var(--bg); overflow-x: hidden; }
  ::selection { background: var(--yellow); color: #000; }
  a { color: var(--yellow); }

  /* ---- TV power-on animation ---- */
  #tvon { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
  #tvon.done { display: none; }
  .tvon-half { position: absolute; left: 0; width: 100%; height: 50.5%; background: #000; }
  .tvon-top { top: 0; animation: tvTop 1.1s cubic-bezier(.45,0,.2,1) 0.45s forwards; }
  .tvon-bot { bottom: 0; animation: tvBot 1.1s cubic-bezier(.45,0,.2,1) 0.45s forwards; }
  .tvon-glow { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 58vw; height: 130px; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,250,240,0.6) 0%, rgba(255,238,180,0.26) 15%, rgba(255,224,130,0.08) 42%, transparent 72%);
    filter: blur(3px); opacity: 0; animation: tvGlow 0.5s ease-out forwards; }
  .tvon-line { position: absolute; top: 50%; left: 50%; height: 6px; width: 0; transform: translate(-50%,-50%);
    background: #fff; box-shadow: 0 0 6px 1px rgba(255,255,255,0.9), 0 0 16px 2px rgba(255,244,190,0.6);
    clip-path: polygon(0 50%, 22% 0, 78% 0, 100% 50%, 78% 100%, 22% 100%);
    animation: tvLine 0.5s ease-out forwards; }
  @keyframes tvLine { 0% { width:0; opacity:0; } 10% { width:2%; opacity:1; } 62% { width:100%; opacity:1; } 100% { width:100%; opacity:0; } }
  @keyframes tvGlow { 0% { opacity:0; transform: translate(-50%,-50%) scaleX(0.12); } 20% { opacity:1; } 62% { opacity:1; transform: translate(-50%,-50%) scaleX(1); } 100% { opacity:0; transform: translate(-50%,-50%) scaleX(1); } }
  @keyframes tvTop { to { transform: translateY(-100%); } }
  @keyframes tvBot { to { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { #tvon { display: none; } }

  .grid-bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(900px 600px at 50% 12%, rgba(255, 230, 0, 0.06), transparent 62%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 100%,
      var(--bg);
  }

  /* ---- CRT / curved old-TV screen (cosmetic, never blocks clicks) ---- */
  .crt {
    position: fixed; inset: 0; z-index: 900; pointer-events: none;
    overflow: hidden;
    box-shadow: inset 0 0 200px 60px rgba(0,0,0,0.62);
  }
  .crt::before {   /* scanlines + faint yellow phosphor wash + flicker */
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px),
      linear-gradient(rgba(255,230,0,0.03), rgba(255,230,0,0.03));
    opacity: 0.68; animation: crtFlicker 5s infinite steps(40);
  }
  .crt::after {   /* strong barrel bulge: dark curved corners + convex center sheen + glare */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(46% 26% at 32% 5%, rgba(255,255,255,0.10), transparent 60%),
      radial-gradient(88% 66% at 50% 46%, rgba(255,255,255,0.055), transparent 60%),
      radial-gradient(108% 106% at 50% 50%, transparent 30%, rgba(0,0,0,0.36) 60%, rgba(0,0,0,0.72) 82%, rgba(0,0,0,0.96) 100%);
  }
  .scan {   /* clipping tube for the sweeping band */
    position: fixed; inset: 0; z-index: 901; pointer-events: none; overflow: hidden;
  }
  .scan::before {   /* bright band, GPU-composited transform (cheap) */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 190px;
    background: linear-gradient(rgba(255,230,0,0), rgba(255,230,0,0.08) 44%, rgba(255,255,255,0.07) 50%, rgba(255,230,0,0.08) 56%, rgba(255,230,0,0));
    animation: scanMove 6s linear infinite;
  }
  @keyframes crtFlicker { 0%,100% { opacity: 0.68; } 48% { opacity: 0.62; } 52% { opacity: 0.54; } }
  @keyframes scanMove { 0% { transform: translateY(-190px); } 100% { transform: translateY(100vh); } }
  @media (prefers-reduced-motion: reduce) { .crt::before { animation: none; } .scan { display: none; } }

  .screen { display: none; }
  .screen.active { display: block; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 18px; }

  /* ---------------- class select ---------------- */
  .sel-head { text-align: center; padding: 74px 20px 6px; position: relative; }
  .langtog { font-family: var(--font); font-size: 0.76rem; color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; letter-spacing: 0.5px; white-space: nowrap; }
  .langtog b { font-weight: 400; color: var(--muted); }
  .langtog b.on { color: var(--yellow); font-weight: 700; }
  .langtog:hover { border-color: var(--yellow); }
  .sel-lang { position: absolute; top: 18px; right: 4px; }
  .sel-head .prompt { color: var(--muted); font-size: 0.9rem; letter-spacing: 1px; }
  .sel-head .prompt b { color: var(--yellow); font-weight: 700; }
  .sel-head h1 {
    font-size: clamp(1.9rem, 5vw, 2.9rem); font-weight: 700; letter-spacing: 4px;
    margin: 14px 0 10px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--yellow), var(--gold), var(--yellow));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shift 5s linear infinite;
  }
  @keyframes shift { to { background-position: 200% center; } }
  .sel-head p { color: var(--muted); font-size: 0.9rem; }
  .classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; padding: 36px 0 50px; }
  .ccard {
    text-align: left; cursor: pointer; font-family: var(--font); color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .ccard::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: var(--yellow); opacity: 0.6; }
  .ccard:hover { transform: translateY(-3px); border-color: var(--yellow); box-shadow: 0 12px 34px rgba(255, 230, 0, 0.12); }
  .ccard__path { color: var(--yellow); font-size: 0.82rem; letter-spacing: 1px; }
  .ccard__name { display: block; font-size: 1.2rem; font-weight: 700; margin: 6px 0 8px; }
  .ccard__blurb { display: block; color: var(--muted); font-size: 0.85rem; line-height: 1.5; min-height: 3.8em; }
  .ccard__meta { display: block; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--text); font-size: 0.8rem; }
  .ccard__meta b { color: var(--yellow); }
  .foot { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 6px 0 40px; }
  .foot a { text-decoration: none; }

  /* ---------------- terminal HUD ---------------- */
  .term { position: sticky; top: 0; z-index: 30; background: rgba(10,10,10,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .term__bar { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .dots i:nth-child(1){ background:#4d4d4d; } .dots i:nth-child(2){ background:#6e6e6e; } .dots i:nth-child(3){ background: var(--yellow); }
  .term__path { color: var(--muted); font-size: 0.86rem; letter-spacing: 0.5px; }
  .term__path b { color: var(--text); }
  .spacer { flex: 1; }
  .tbtn { font-family: var(--font); font-size: 0.8rem; color: var(--text); background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .tbtn:hover { border-color: var(--yellow); background: rgba(255,230,0,0.1); }
  .tbtn.gold { color: var(--yellow); }
  .term__status { display: flex; align-items: center; gap: 14px; padding: 9px 16px; font-size: 0.82rem; flex-wrap: wrap; }
  .term__rank { color: var(--yellow); font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .pbar { width: 130px; height: 7px; background: rgba(255,255,255,0.09); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .pbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--yellow)); transition: width 0.4s; }
  .term__stat { color: var(--muted); white-space: nowrap; }
  .term__stat b { color: var(--text); }

  .tree-hint { text-align: center; color: var(--muted); font-size: 0.82rem; padding: 14px 16px 0; }
  .tree-hint b { color: var(--yellow); }

  /* ---------------- graph canvas ---------------- */
  .tree-scroll { width: 100%; overflow: auto; padding: 16px 0 60px; }
  .canvas { position: relative; margin: 0 auto; }
  .traces { position: absolute; inset: 0; pointer-events: none; }
  .trace { fill: none; stroke: rgba(150,160,190,0.18); stroke-width: 1.6; stroke-linejoin: round; transition: stroke 0.3s, stroke-width 0.3s; }
  .trace.lit { stroke: var(--yellow); stroke-width: 2; filter: url(#glow); }

  .card {
    position: absolute; width: 172px; height: 52px; transform: translateX(-50%);
    display: grid; grid-template-columns: auto 1fr; column-gap: 9px; align-content: center;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; font-family: var(--font);
    background: var(--panel); border: 1px solid rgba(255,255,255,0.12); transition: all 0.18s; text-align: left;
  }
  .card .tag { grid-row: 1 / 3; align-self: center; font-size: 0.9rem; color: var(--dim); }
  .card .tag::before { content: "[×]"; }
  .card .nm { grid-column: 2; font-size: 0.86rem; font-weight: 700; color: var(--muted); line-height: 1.2; }
  .card .hrs { grid-column: 2; font-size: 0.72rem; color: var(--dim); margin-top: 2px; }

  .card.locked { border-style: dashed; }
  .card.available { border-color: var(--line); background: var(--panel-2); box-shadow: 0 0 0 rgba(255,230,0,0); animation: avail 2.4s ease-in-out infinite; }
  .card.available .tag { color: var(--yellow); }
  .card.available .tag::before { content: "[»]"; }
  .card.available .nm { color: var(--text); }
  .card.unlocked { border-color: var(--yellow); background: linear-gradient(180deg, rgba(255,230,0,0.1), rgba(255,230,0,0.03)); }
  .card.unlocked .tag { color: var(--yellow); }
  .card.unlocked .tag::before { content: "[✓]"; }
  .card.unlocked .nm { color: #fff4cf; }
  .card.unlocked .hrs { color: var(--gold); }
  .card:hover { border-color: var(--yellow); transform: translateX(-50%) translateY(-2px); }
  .card.selected { border-color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,0.4); }
  .card.flash { animation: flash 0.5s; }

  @keyframes avail { 0%,100% { box-shadow: 0 0 0 rgba(255,230,0,0); } 50% { box-shadow: 0 0 16px rgba(255,230,0,0.18); } }
  @keyframes flash { 0% { box-shadow: 0 0 0 rgba(255,230,0,0.7); } 100% { box-shadow: 0 0 26px rgba(255,230,0,0); } }

  /* ---------------- panel ---------------- */
  .panel {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(150%);
    width: min(540px, calc(100% - 28px));
    max-height: calc(100vh - 36px); max-height: calc(100dvh - 36px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; z-index: 40; transition: transform 0.3s cubic-bezier(.2,.7,.3,1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  .panel.show { transform: translateX(-50%) translateY(0); }
  .panel__top { display: flex; align-items: baseline; gap: 10px; position: sticky; top: 0; z-index: 2; margin: -20px -20px 0; padding: 20px 20px 10px; background: var(--panel); }
  .panel__title { font-size: 1.15rem; font-weight: 700; flex: 1; }
  .panel__title::before { content: "> "; color: var(--yellow); }
  .panel__badge { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .panel__badge.b-unlocked { color: var(--yellow); }
  .panel__badge.b-available { color: var(--gold); }
  .panel__x { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; line-height: 1; }
  .panel__desc { color: var(--muted); line-height: 1.6; margin: 12px 0; font-size: 0.92rem; }
  .panel__row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .panel__cost { color: var(--text); font-size: 0.88rem; }
  .panel__cost b { color: var(--yellow); }
  .panel__guide { color: var(--yellow); text-decoration: none; font-size: 0.88rem; font-weight: 500; }
  .panel__guide:hover { text-decoration: underline; }
  .panel__actions { display: flex; gap: 10px; margin-top: 16px; }
  .act { flex: 1; border: none; border-radius: 9px; padding: 11px; font-family: var(--font); font-weight: 700; font-size: 0.86rem; cursor: pointer; transition: all 0.18s; }
  .act--unlock { background: var(--yellow); color: #1a1400; }
  .act--unlock:hover { box-shadow: 0 0 22px rgba(255,230,0,0.4); }
  .act--lock { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .act--lock:hover { border-color: var(--yellow); }
  .act--disabled { background: rgba(255,255,255,0.04); color: var(--muted); cursor: not-allowed; }

  .card.hidden { border-style: dashed; opacity: 0.5; cursor: not-allowed; }
  .card.hidden .tag::before { content: "[?]"; }
  .card.hidden .nm { filter: blur(4.5px); color: var(--muted); }
  .card.hidden .hrs { filter: blur(3px); }

  .panel__mentor { border-left: 2px solid var(--yellow); background: rgba(255,230,0,0.05); padding: 10px 14px; margin: 12px 0; border-radius: 0 8px 8px 0; font-size: 0.88rem; line-height: 1.55; color: #d8d8d8; }
  .panel__mentor::before { content: "// mentor \2014 barik"; display: block; color: var(--yellow); font-size: 0.72rem; letter-spacing: 1px; margin-bottom: 6px; }
  body[data-lang="ua"] .panel__mentor::before { content: "// ментор \2014 barik"; }
  .panel__res { margin: 12px 0; }
  .panel__res .res-h { color: var(--muted); font-size: 0.74rem; letter-spacing: 1px; margin-bottom: 8px; }
  .panel__res .res-h::before { content: "> "; color: var(--yellow); }
  .panel__res a { display: inline-flex; align-items: center; gap: 6px; color: var(--yellow); text-decoration: none; font-size: 0.86rem; margin: 3px 12px 3px 0; }
  .panel__res a:hover { text-decoration: underline; }
  .panel__res .lang { color: var(--muted); font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  /* ---------------- quiz ---------------- */
  .panel__quiz { margin: 12px 0; }
  .panel__quiz .quiz-h { color: var(--muted); font-size: 0.74rem; letter-spacing: 1px; margin-bottom: 10px; }
  .panel__quiz .quiz-h::before { content: "> "; color: var(--yellow); }
  .quiz-q { margin-bottom: 14px; }
  .quiz-qt { font-size: 0.9rem; color: var(--text); margin-bottom: 8px; line-height: 1.45; }
  .quiz-opts { display: grid; gap: 6px; }
  .quiz-opt { text-align: left; font-family: var(--font); font-size: 0.85rem; color: var(--text); background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; transition: all 0.15s; }
  .quiz-opt:hover { border-color: var(--yellow); }
  .quiz-opt.sel { border-color: var(--yellow); background: rgba(255,230,0,0.1); }
  .quiz-opt.right { border-color: #46d17f; background: rgba(70,209,127,0.14); color: #d7ffe7; }
  .quiz-opt.wrong { border-color: #ff5f56; background: rgba(255,95,86,0.13); color: #ffdedb; }
  .quiz-why { margin-top: 7px; font-size: 0.8rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; line-height: 1.5; }

  .toast { position: fixed; left: 50%; top: 0; transform: translate(-50%, calc(-100% - 14px)); background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 11px 18px; border-radius: 10px; z-index: 60; font-size: 0.86rem; transition: transform 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .toast.show { transform: translate(-50%, 18px); }
  .toast b { color: var(--yellow); }

  @media (max-width: 640px) { .term__stat.hide-sm { display: none; } }
</style>
</head>
<body>
<div id="tvon" aria-hidden="true"><div class="tvon-half tvon-top"></div><div class="tvon-half tvon-bot"></div><div class="tvon-glow"></div><div class="tvon-line"></div></div>
<div class="grid-bg"></div>
<div class="crt" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<!-- ===================== CLASS SELECT ===================== -->
<section id="screen-select" class="screen active">
  <div class="wrap">
    <div class="sel-head">
      <button class="langtog sel-lang" onclick="toggleLang()"><b data-l="en">EN</b> · <b data-l="ua">UA</b></button>
      <div class="prompt">&gt; skilltree <b id="i18nSelCmd">--select-project</b></div>
      <h1 id="i18nSelTitle">Choose your project</h1>
      <p id="i18nSelSub">Pick a path, then unlock the graph. Progress saves in your browser.</p>
    </div>
    <div class="classes" id="classes"></div>
    <div class="foot"><span id="i18nFoot">built by</span> <a href="https://www.tiktok.com/@barik7667" target="_blank" rel="noopener">barik</a></div>
  </div>
</section>

<!-- ===================== TREE ===================== -->
<section id="screen-tree" class="screen">
  <div class="term">
    <div class="term__bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="term__path">skilltree <b id="hudPath">~/</b></span>
      <span class="spacer"></span>
      <button class="langtog" onclick="toggleLang()"><b data-l="en">EN</b> · <b data-l="ua">UA</b></button>
      <button class="tbtn" id="hudBack" onclick="backToSelect()">◄ projects</button>
    </div>
    <div class="term__status">
      <span class="term__rank" id="hudRank">RANK: INTERN</span>
      <span class="pbar"><i id="hudBar"></i></span>
      <span class="term__stat" id="hudPct">0%</span>
      <span class="term__stat hide-sm" id="hudSkills">0/0 unlocked</span>
      <span class="term__stat hide-sm" id="hudHours">0/0h</span>
      <span class="spacer"></span>
      <button class="tbtn gold" id="hudShare" onclick="shareBuild()">&gt; share</button>
      <button class="tbtn" id="hudReset" onclick="resetClass()">&gt; reset</button>
    </div>
  </div>
  <p class="tree-hint" id="treeHint">Click a node to unlock it · locked nodes need their <b>dependencies</b> first</p>
  <div class="tree-scroll">
    <div class="canvas" id="canvas">
      <svg class="traces" id="traces" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="edges"></g>
      </svg>
      <div id="nodes"></div>
    </div>
  </div>
</section>

<!-- detail panel -->
<div class="panel" id="panel">
  <div class="panel__top">
    <div class="panel__title" id="pTitle">skill</div>
    <span class="panel__badge" id="pBadge">—</span>
    <button class="panel__x" onclick="closePanel()" aria-label="Close">×</button>
  </div>
  <p class="panel__desc" id="pDesc"></p>
  <div class="panel__mentor" id="pMentor" style="display:none"></div>
  <div class="panel__res" id="pRes" style="display:none"></div>
  <div class="panel__quiz" id="pQuiz" style="display:none"></div>
  <div class="panel__row">
    <span class="panel__cost"><span id="pCostLabel">cost</span>: <b id="pCost">~0h</b></span>
  </div>
  <div class="panel__actions" id="pActions"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =============================================================
   SKILL TREE DATA
   -------------------------------------------------------------
   node: { id, name, tier, req:[ids], hours, desc, guide }
   • tier  = row (0 = foundation)
   • req   = ids that must be unlocked first (from a lower tier)
   • hours = grind cost, summed into "hours invested"
   • guide = OPTIONAL url. Paste YOUR youtube/article link here,
             e.g. guide: "https://youtu.be/XXXX"  (leave "" to hide).
   ============================================================= */
const CLASSES = {
  bot: {
    name: { en:"Telegram Bot", ua:"Telegram-бот" },

const totalHours = (k) => nodesOf(k).reduce((s,n)=>s+n.hours,0);

/* ---------- i18n ---------- */
let lang = localStorage.getItem("skilltree_lang") || "en";
const I18N = {
  en: {
    selCmd:"--select-project", selTitle:"Choose your project",
    selSub:"Pick a path, then unlock the graph. Progress saves in your browser.",
    skills:"skills", toMaster:"to master", foot:"built by",
    back:"◄ projects", share:"&gt; share", reset:"&gt; reset", rank:"RANK", unlocked:"unlocked",
    hint:'Click a node to unlock it · locked nodes need their <b>dependencies</b> first',
    resources:"resources", quizHdr:"quiz — pass to unlock", cost:"cost",
    takeQuiz:"&gt; take quiz to unlock", unlockBtn:"&gt; unlock", submit:"&gt; submit answers",
    uninstall:"&gt; uninstall", requires:"requires",
    st:{ available:"available", unlocked:"unlocked", locked:"locked", hidden:"hidden" },
    tInstalled:"installed", tAnswerAll:"answer every question first",
    tPassed:"\u2713 quiz passed", tWrong:"not all correct — fix the reds & resubmit",
    tEncrypted:"\uD83D\uDD12 encrypted — complete earlier skills first",
    tShared:"build link copied — go flex it", tReset:"progress reset",
    confirmReset:"Reset all progress for"
  },
  ua: {
    selCmd:"--вибрати-проєкт", selTitle:"Обери свій проєкт",
    selSub:"Обери напрям і відкривай граф. Прогрес зберігається у браузері.",
    skills:"навичок", toMaster:"до майстерності", foot:"зроблено",
    back:"◄ проєкти", share:"&gt; поділитися", reset:"&gt; скинути", rank:"РАНГ", unlocked:"відкрито",
    hint:'Клікни ноду, щоб відкрити · закриті ноди потребують <b>залежностей</b>',
    resources:"ресурси", quizHdr:"квіз — пройди, щоб відкрити", cost:"час",
    takeQuiz:"&gt; пройти квіз", unlockBtn:"&gt; відкрити", submit:"&gt; надіслати відповіді",
    uninstall:"&gt; видалити", requires:"потрібно",
    st:{ available:"доступно", unlocked:"відкрито", locked:"закрито", hidden:"приховано" },
    tInstalled:"встановлено", tAnswerAll:"спочатку дай відповідь на всі питання",
    tPassed:"\u2713 квіз пройдено", tWrong:"не всі вірні — виправ червоні й надішли ще раз",
    tEncrypted:"\uD83D\uDD12 зашифровано — спочатку пройди попередні навички",
    tShared:"посилання скопійовано — хвались", tReset:"прогрес скинуто",
    confirmReset:"Скинути весь прогрес для"
  }
};
const T = () => I18N[lang];
const tr = (v) => (v && typeof v === "object" && !Array.isArray(v) && v.en !== undefined) ? (v[lang] !== undefined ? v[lang] : v.en) : v;
function optsOf(it){ return Array.isArray(it.opts) ? it.opts : (it.opts[lang] || it.opts.en); }
function toggleLang(){
  lang = lang === "en" ? "ua" : "en";
  localStorage.setItem("skilltree_lang", lang);
  document.body.dataset.lang = lang;
  applyI18n(); renderSelect();
  if ($("screen-tree").classList.contains("active")){ const k = currentKey, open = selectedId; openClass(k); if (open){ const nn = nodeById(k, open); if (nn) openPanel(nn); } }
}
function applyI18n(){
  const t = T();
  document.querySelectorAll(".langtog").forEach(el =>
    el.querySelectorAll("b[data-l]").forEach(b => b.classList.toggle("on", b.dataset.l === lang)));
  const set = (id, v) => { const e = $(id); if (e) e.innerHTML = v; };
  set("i18nSelCmd", t.selCmd); set("i18nSelTitle", t.selTitle); set("i18nSelSub", t.selSub);
  set("i18nFoot", t.foot); set("hudBack", t.back); set("hudShare", t.share); set("hudReset", t.reset);
  set("treeHint", t.hint); const cl = $("pCostLabel"); if (cl) cl.textContent = t.cost;
}

/* ---------- class select ---------- */
function renderSelect(){
  const t = T();
  $("classes").innerHTML = Object.entries(CLASSES).map(([key,c]) =>
    `<button class="ccard" onclick="openClass('${key}')">
      <span class="ccard__path">~/${key}</span>
      <span class="ccard__name">${esc(tr(c.name))}</span>
      <span class="ccard__blurb">${esc(tr(c.blurb))}</span>
      <span class="ccard__meta"><b>${c.nodes.length}</b> ${t.skills} · <b>~${totalHours(key)}h</b> ${t.toMaster}</span>
    </button>`).join("");
}

/* ---------- layout ---------- */
function layout(key){
  const nodes = nodesOf(key), tiers = {};
  nodes.forEach(n => (tiers[n.tier] = tiers[n.tier] || []).push(n));
  const tk = Object.keys(tiers).map(Number).sort((a,b)=>a-b);
  const maxCount = Math.max(...tk.map(t => tiers[t].length));
  const W = Math.max(940, maxCount * 232);
  const H = PAD_Y * 2 + (tk.length - 1) * ROW + CARD_H;
  tk.forEach((t, ti) => {
    const row = tiers[t];
    row.forEach((n, i) => {
      n._x = PAD_X + (i + 1) * (W - PAD_X * 2) / (row.length + 1);
      n._y = PAD_Y + ti * ROW;   // top of card
    });
  });
  return { W, H };
}

/* ---------- open a class ---------- */
function openClass(key){
  currentKey = key;
  const params = new URLSearchParams(location.search);
  let ids = [];
  if (params.get("c") === key && params.get("b") !== null){
    ids = params.get("b").split(".").filter(Boolean);
    history.replaceState(null, "", location.pathname);
  } else {
    try { ids = JSON.parse(localStorage.getItem(LS(key)) || "[]"); } catch(e){ ids = []; }
  }
  unlocked = new Set(ids.filter(id => nodeById(key, id)));
  sanitize(); save();

  const { W, H } = layout(key);
  const canvas = $("canvas");
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  const svg = $("traces");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);

  // edges: orthogonal (down → across → down)
  let edges = "";
  nodesOf(key).forEach(n => {
    const cx = n._x, cyT = n._y;                 // child top-center
    n.req.forEach(rid => {
      const r = nodeById(key, rid); if (!r) return;
      const px = r._x, pyB = r._y + CARD_H;       // parent bottom-center
      const midY = (pyB + cyT) / 2;
      const d = `M ${px} ${pyB} L ${px} ${midY} L ${cx} ${midY} L ${cx} ${cyT}`;
      edges += `<path class="trace" data-a="${rid}" data-b="${n.id}" d="${d}"/>`;
    });
  });
  $("edges").innerHTML = edges;

  // nodes as cards
  $("nodes").innerHTML = nodesOf(key).map(n =>
    `<button class="card" data-id="${n.id}" style="left:${n._x}px;top:${n._y}px" onclick="clickNode('${n.id}')">
      <span class="tag"></span>
      <span class="nm">${esc(tr(n.name))}</span>
      <span class="hrs">~${n.hours}h</span>
    </button>`).join("");

  $("hudPath").textContent = "~/" + key;
  showScreen("tree");
  closePanel();
  updateStates();
}

/* ---------- logic (fog of war: hidden → locked → available → completed) ---------- */
const prereqsDone = (n) => n.req.every(r => unlocked.has(r));
const isRevealed  = (n) => n.tier === 0 || n.req.some(r => unlocked.has(r));
const isAvailable = (key, n) => isRevealed(n) && prereqsDone(n) && !unlocked.has(n.id);
function stateOf(n){
  if (unlocked.has(n.id)) return "completed";
  if (!isRevealed(n)) return "hidden";
  return prereqsDone(n) ? "available" : "locked";
}
function sanitize(){
  let changed = true;
  while (changed){ changed = false;
    for (const n of nodesOf(currentKey))
      if (unlocked.has(n.id) && !prereqsDone(n)){ unlocked.delete(n.id); changed = true; }
  }
}
function dependents(id){
  const out = new Set(); let f = [id];
  while (f.length){ const cur = f.pop();
    for (const n of nodesOf(currentKey)) if (n.req.includes(cur) && !out.has(n.id)){ out.add(n.id); f.push(n.id); }
  }
  return out;
}
function clickNode(id){
  const n = nodeById(currentKey, id), st = stateOf(n);
  if (st === "hidden"){ toast(T().tEncrypted); return; }
  selectedId = id;
  if (st === "locked"){
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if (el){ el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),400); }
  }
  openPanel(n);
}
function doUnlock(id){                         // complete a node
  const n = nodeById(currentKey, id);
  if (unlocked.has(id) || !(isRevealed(n) && prereqsDone(n))) return;
  unlocked.add(id); save(); updateStates(); openPanel(n);
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el){ el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),500); }
  toast(T().tInstalled + `: <b>${esc(tr(n.name))}</b>`);
}
function doLock(id){
  if (!unlocked.has(id)) return;
  unlocked.delete(id); dependents(id).forEach(d => unlocked.delete(d));
  save(); updateStates(); openPanel(nodeById(currentKey, id));
}
function updateStates(){
  const key = currentKey;
  nodesOf(key).forEach(n => {
    const el = document.querySelector(`.card[data-id="${n.id}"]`); if (!el) return;
    const st = stateOf(n);
    el.classList.remove("hidden","locked","available","unlocked","selected");
    el.classList.add(st === "completed" ? "unlocked" : st);
    if (n.id === selectedId) el.classList.add("selected");
  });
  document.querySelectorAll(".trace").forEach(e =>
    e.classList.toggle("lit", unlocked.has(e.dataset.a) && unlocked.has(e.dataset.b)));
  const total = nodesOf(key).length, got = unlocked.size, pct = total ? got/total : 0;
  const hoursGot = nodesOf(key).filter(n => unlocked.has(n.id)).reduce((s,n)=>s+n.hours,0);
  $("hudRank").textContent = T().rank + ": " + RANKS.find(r => pct >= r.p).name;
  $("hudBar").style.width = (pct*100) + "%";
  $("hudPct").textContent = Math.round(pct*100) + "%";
  $("hudSkills").innerHTML = `<b>${got}</b>/${total} ${T().unlocked}`;
  $("hudHours").innerHTML = `<b>${hoursGot}</b>/${totalHours(key)}h`;
}

/* ---------- panel ---------- */
function openPanel(n){
  selectedId = n.id;
  const st = stateOf(n), label = st === "completed" ? "unlocked" : st;
  $("pTitle").textContent = tr(n.name);
  const b = $("pBadge"); b.textContent = T().st[label] || label; b.className = "panel__badge b-" + label;
  $("pDesc").textContent = tr(n.desc);
  $("pCost").textContent = "~" + n.hours + "h";
  const m = $("pMentor");
  if (n.mentor){ m.textContent = tr(n.mentor); m.style.display = ""; } else m.style.display = "none";
  const rEl = $("pRes"), en = (n.res && n.res.en) || [], ru = (n.res && n.res.ru) || [];
  if (en.length || ru.length){
    let h = '<div class="res-h">' + T().resources + '</div>';
    en.forEach(r => h += `<a href="${r.u}" target="_blank" rel="noopener"><span class="lang">EN</span>${esc(r.t)} \u2197</a>`);
    ru.forEach(r => h += `<a href="${r.u}" target="_blank" rel="noopener"><span class="lang">RU</span>${esc(r.t)} \u2197</a>`);
    rEl.innerHTML = h; rEl.style.display = "";
  } else rEl.style.display = "none";
  const pq = $("pQuiz"); pq.style.display = "none"; pq.innerHTML = "";
  const a = $("pActions");
  if (st === "completed") a.innerHTML = `<button class="act act--lock" onclick="doLock('${n.id}')">${T().uninstall}</button>`;
  else if (st === "available"){
    if (n.quiz && n.quiz.length) a.innerHTML = `<button class="act act--unlock" onclick="startQuiz('${n.id}')">${T().takeQuiz}</button>`;
    else a.innerHTML = `<button class="act act--unlock" onclick="doUnlock('${n.id}')">${T().unlockBtn} (${n.hours}h)</button>`;
  }
  else { const need = n.req.filter(r => !unlocked.has(r)).map(r => tr(nodeById(currentKey, r).name)).join(", ");
    a.innerHTML = `<button class="act act--disabled" disabled>${T().requires}: ${esc(need)}</button>`; }
  $("panel").classList.add("show");
  updateStates();
}
function closePanel(){ $("panel").classList.remove("show"); selectedId = null; updateStates(); }

/* ---------- quiz gate ---------- */
function startQuiz(id){
  const n = nodeById(currentKey, id);
  if (!n.quiz || !n.quiz.length){ doUnlock(id); return; }
  quizAnswers = new Array(n.quiz.length).fill(-1);
  const pq = $("pQuiz");
  pq.style.display = "";
  pq.innerHTML = '<div class="quiz-h">' + T().quizHdr + '</div>' + n.quiz.map((it, qi) =>
    `<div class="quiz-q" data-qi="${qi}">
      <div class="quiz-qt">${qi+1}. ${esc(tr(it.q))}</div>
      <div class="quiz-opts">${optsOf(it).map((o,oi)=>
        `<button class="quiz-opt" data-qi="${qi}" data-oi="${oi}" onclick="pickAnswer(${qi},${oi})">${esc(o)}</button>`).join("")}</div>
      <div class="quiz-why" style="display:none">${it.why ? esc(tr(it.why)) : ""}</div>
    </div>`).join("");
  $("pActions").innerHTML = `<button class="act act--unlock" onclick="submitQuiz('${id}')">${T().submit}</button>`;
}
function pickAnswer(qi, oi){
  quizAnswers[qi] = oi;
  document.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(b => {
    b.classList.remove("right","wrong");
    b.classList.toggle("sel", +b.dataset.oi === oi);
  });
}
function submitQuiz(id){
  const n = nodeById(currentKey, id);
  if (quizAnswers.includes(-1)){ toast(T().tAnswerAll); return; }
  let allRight = true;
  n.quiz.forEach((it, qi) => {
    const chosen = quizAnswers[qi];
    if (chosen !== it.correct) allRight = false;
    document.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(b => {
      const oi = +b.dataset.oi; b.classList.remove("sel","right","wrong");
      if (oi === it.correct) b.classList.add("right");
      else if (oi === chosen) b.classList.add("wrong");
    });
    const w = document.querySelector(`.quiz-q[data-qi="${qi}"] .quiz-why`);
    if (w && it.why) w.style.display = "";
  });
  if (allRight){ toast(T().tPassed); doUnlock(id); }
  else toast(T().tWrong);
}

/* ---------- persistence + share ---------- */
function save(){ if (currentKey) localStorage.setItem(LS(currentKey), JSON.stringify([...unlocked])); }
function resetClass(){
  if (!confirm(T().confirmReset + " " + tr(CLASSES[currentKey].name) + "?")) return;
  unlocked = new Set(); save(); closePanel(); updateStates(); toast(T().tReset);
}
function shareBuild(){
  const url = location.origin + location.pathname + "?c=" + currentKey + "&b=" + [...unlocked].join(".");
  const done = () => toast(T().tShared);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Copy your build link:", url));
  else prompt("Copy your build link:", url);
}

/* ---------- screens + toast ---------- */
function showScreen(which){
  $("screen-select").classList.toggle("active", which === "select");
  $("screen-tree").classList.toggle("active", which === "tree");
  window.scrollTo({ top: 0 });
}
function backToSelect(){ closePanel(); showScreen("select"); }
let toastT;
function toast(msg){ const t = $("toast"); t.innerHTML = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200); }

/* ---------- boot ---------- */
document.body.dataset.lang = lang;
applyI18n();
renderSelect();
(function(){ const c = new URLSearchParams(location.search).get("c"); if (c && CLASSES[c]) openClass(c); })();
setTimeout(function(){ var t = document.getElementById("tvon"); if (t) t.classList.add("done"); }, 1650);
</script>
